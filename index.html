<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="縦書き">
<meta name="theme-color" content="#2c2416">
<link rel="apple-touch-icon" href="icon-192.png">
<title>縦書きエディター</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --washi: #f5f0e8;
    --ink: #1a1208;
    --ink-light: #3d3020;
    --vermillion: #c0392b;
    --gold: #c9a84c;
    --toolbar-h: 28px;
    --status-h: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: #c8b89a;
    font-family: 'Noto Serif JP', serif;
    height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  #toolbar {
    height: var(--toolbar-h);
    background: linear-gradient(180deg, #1a1208 0%, #2c2416 100%);
    border-bottom: 1px solid #c9a84c44;
    display: flex; align-items: center;
    padding: 0 8px; gap: 2px;
    flex-shrink: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  #toolbar-title {
    flex: 1; color: var(--gold);
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.12em; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 0 4px;
  }
  .tb-btn {
    width: 26px; height: 26px; border-radius: 6px; border: none;
    background: transparent; color: #c9a84c99;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s; flex-shrink: 0;
    font-size: 12px;
  }
  .tb-btn:active { background: #c9a84c22; color: var(--gold); }
  .tb-btn.active { color: var(--vermillion) !important; }
  .tb-btn.disabled { color: #c9a84c33 !important; pointer-events: none; }
  .tb-btn svg { width: 14px; height: 14px; }

  #paper-wrap { flex: 1; overflow: hidden; background: #c8b89a; position: relative; }

  #scroll-container {
    width: 100%; height: calc(100% - 10px);
    overflow-x: scroll; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    direction: rtl;
    padding: 16px 20px 0 20px;
  }

  #paper {
    background: var(--washi);
    box-shadow: -2px 0 4px rgba(0,0,0,0.1), 2px 0 4px rgba(0,0,0,0.1);
    position: relative;
    border-radius: 2px;
    overflow: hidden;
    direction: ltr;
    margin-top: auto; margin-bottom: auto;
    display: block;
    float: right;
  }

  #grid-canvas {
    position: absolute; top: 0; right: 0;
    pointer-events: none; z-index: 1; display: block;
    background: transparent;
  }

  /* オーバーレイキャンバス: コメントハイライト・改行記号・ぶら下げ描画用 */
  #overlay-canvas {
    position: absolute; top: 0; right: 0;
    pointer-events: none; z-index: 2; display: block;
    background: transparent;
  }

  #editor {
    position: absolute;
    top: 0; right: 0;
    writing-mode: vertical-rl; text-orientation: mixed;
    outline: none;
    font-family: 'Noto Serif JP', serif;
    color: var(--ink);
    word-break: break-all; white-space: pre-wrap; overflow-wrap: break-word;
    z-index: 3;
    caret-color: var(--vermillion);
    -webkit-user-select: text; user-select: text;
    letter-spacing: 0;
    display: block;
    min-width: 100%;
    width: max-content;
  }
  #editor:empty::before {
    content: attr(data-placeholder);
    color: rgba(100,80,50,0.3); pointer-events: none; font-style: italic;
  }

  #statusbar {
    height: var(--status-h);
    background: linear-gradient(0deg, #1a1208 0%, #2c2416 100%);
    border-top: 1px solid #c9a84c33;
    display: flex; align-items: center;
    padding: 0 8px; gap: 6px; flex-shrink: 0;
  }
  .status-item {
    font-family: 'Noto Sans JP', sans-serif; font-size: 9px;
    color: #c9a84c88; display: flex; align-items: center; gap: 3px;
    letter-spacing: 0.04em; white-space: nowrap;
  }
  .status-item span { color: #c9a84ccc; }
  .status-sep { color: #c9a84c33; font-size: 9px; }

  #settings-panel {
    position: absolute; bottom: var(--status-h); left: 0; right: 0;
    background: #1a1208f2; border-top: 1px solid #c9a84c44;
    padding: 12px 16px; display: none; z-index: 20;
    backdrop-filter: blur(10px);
    max-height: 60vh; overflow-y: auto;
  }
  #settings-panel.open { display: block; }
  .setting-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .setting-row:last-child { margin-bottom: 0; }
  .setting-label { color: var(--gold); font-size: 12px; font-family: 'Noto Sans JP', sans-serif; letter-spacing: 0.06em; width: 110px; flex-shrink: 0; }
  .setting-controls { display: flex; align-items: center; gap: 6px; flex: 1; }
  .num-btn {
    width: 30px; height: 30px; border-radius: 6px;
    border: 1px solid #c9a84c44; background: #2c2416; color: var(--gold);
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-family: sans-serif;
  }
  .num-btn:active { background: #c9a84c22; }
  .num-input {
    width: 52px; text-align: center; background: #2c2416;
    border: 1px solid #c9a84c44; border-radius: 6px;
    color: var(--gold); font-size: 14px; font-family: 'Noto Sans JP', sans-serif;
    padding: 4px; outline: none;
  }
  .num-input:focus { border-color: var(--vermillion); }
  .setting-unit { color: #c9a84c88; font-size: 11px; font-family: 'Noto Sans JP', sans-serif; }
  .toggle {
    width: 42px; height: 22px; background: #3d3020; border-radius: 11px;
    position: relative; cursor: pointer; border: 1px solid #c9a84c33;
    transition: background 0.2s; flex-shrink: 0;
  }
  .toggle.on { background: #7a2d23; border-color: #c0392b88; }
  .toggle::after {
    content: ''; position: absolute; width: 16px; height: 16px;
    background: #c9a84c66; border-radius: 50%; top: 2px; left: 2px;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle.on::after { transform: translateX(20px); background: var(--vermillion); }
  .toggle-text { font-size: 11px; font-family: 'Noto Sans JP', sans-serif; color: #c9a84c66; }
  .toggle.on ~ .toggle-text { color: #c0392b; }
  .chars-per-page { font-size: 11px; font-family: 'Noto Sans JP', sans-serif; color: #c9a84c55; }
  .setting-sep {
    border: none; border-top: 1px solid #c9a84c22; margin: 8px 0;
  }

  #modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 50; align-items: center; justify-content: center; backdrop-filter: blur(4px);
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: var(--washi); border-radius: 12px; padding: 24px;
    width: 85%; max-width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #modal h2 { font-size: 16px; color: var(--ink); margin-bottom: 16px; text-align: center; letter-spacing: 0.1em; }
  .modal-input {
    width: 100%; border: 1px solid rgba(100,80,50,0.3); border-radius: 8px;
    padding: 10px 12px; font-family: 'Noto Serif JP', serif; font-size: 14px;
    background: #fff8f0; color: var(--ink); margin-bottom: 12px; outline: none;
  }
  .modal-input:focus { border-color: var(--vermillion); }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btn {
    flex: 1; padding: 10px; border-radius: 8px; border: none;
    font-family: 'Noto Serif JP', serif; font-size: 14px; cursor: pointer; letter-spacing: 0.05em;
  }
  .modal-btn.primary { background: var(--vermillion); color: #fff; }
  .modal-btn.secondary { background: rgba(100,80,50,0.1); color: var(--ink-light); }

  #toast {
    position: fixed; bottom: calc(var(--status-h) + 12px); left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: #1a1208ee; color: var(--gold); padding: 7px 18px; border-radius: 20px;
    font-size: 12px; font-family: 'Noto Sans JP', sans-serif;
    opacity: 0; transition: opacity 0.25s, transform 0.25s;
    pointer-events: none; z-index: 100; white-space: nowrap;
    border: 1px solid #c9a84c44; letter-spacing: 0.05em;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ネイティブスクロールバーを非表示 */
  #scroll-container::-webkit-scrollbar { display: none; }
  #scroll-container { scrollbar-width: none; -ms-overflow-style: none; }

  /* カスタムスクロールバー */
  #custom-scrollbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 10px; background: rgba(0,0,0,0.06);
    z-index: 15; cursor: pointer;
  }
  #scrollbar-thumb {
    position: absolute; top: 2px; height: 6px;
    min-width: 30px; border-radius: 3px;
    background: #c9a84c77;
    cursor: grab; transition: background 0.15s;
  }
  #scrollbar-thumb:hover { background: #c9a84caa; }
  #scrollbar-thumb:active, #scrollbar-thumb.dragging { background: var(--gold); cursor: grabbing; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  #paper { animation: fadeIn 0.35s ease; }
</style>
</head>
<body>

<div id="toolbar">
  <button class="tb-btn" id="btn-new" onclick="newDoc()" title="新規">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14,2 14,8 20,8"/>
      <line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
    </svg>
  </button>
  <button class="tb-btn" id="btn-open" onclick="openDoc()" title="開く">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
    </svg>
  </button>
  <button class="tb-btn" id="btn-undo" onclick="doUndo()" title="元に戻す (Ctrl+Z)">↩</button>
  <button class="tb-btn" id="btn-redo" onclick="doRedo()" title="やり直し (Ctrl+Y)">↪</button>

  <div id="toolbar-title">縦書きエディター</div>

  <button class="tb-btn" id="btn-settings" onclick="toggleSettings()" title="設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <button class="tb-btn" id="btn-saveas" onclick="saveAs()" title="別名保存">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/>
      <line x1="19" y1="8" x2="22" y2="5"/><line x1="22" y1="5" x2="19" y2="2"/>
    </svg>
  </button>
  <button class="tb-btn" id="btn-save" onclick="saveOverwrite()" title="上書き保存 (Ctrl+S)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/>
    </svg>
  </button>
</div>

<div id="paper-wrap">
  <div id="scroll-container">
    <div id="paper">
      <canvas id="grid-canvas"></canvas>
      <canvas id="overlay-canvas"></canvas>
      <div id="editor"
           contenteditable="true"
           spellcheck="false"
           data-placeholder="ここに文章を入力してください。"
           oninput="onInput()"
           onkeydown="onKeyDown(event)"></div>
    </div>
  </div>
  <div id="custom-scrollbar"><div id="scrollbar-thumb"></div></div>
</div>

<div id="settings-panel">
  <div class="setting-row">
    <div class="setting-label">文字サイズ</div>
    <div class="setting-controls">
      <button class="num-btn" onclick="adjustVal('fontSize',-1)">−</button>
      <input class="num-input" id="in-fontsize" type="number" min="10" max="36" value="18"
             onchange="setVal('fontSize',this.value,10,36)">
      <span class="setting-unit">px</span>
      <button class="num-btn" onclick="adjustVal('fontSize',1)">＋</button>
    </div>
  </div>
  <div class="setting-row">
    <div class="setting-label">縦（行数）</div>
    <div class="setting-controls">
      <button class="num-btn" onclick="adjustVal('rows',-1)">−</button>
      <input class="num-input" id="in-rows" type="number" min="5" max="60" value="20"
             onchange="setVal('rows',this.value,5,60)">
      <span class="setting-unit">行 / ページ</span>
      <button class="num-btn" onclick="adjustVal('rows',1)">＋</button>
    </div>
  </div>
  <div class="setting-row">
    <div class="setting-label">横（列数）</div>
    <div class="setting-controls">
      <button class="num-btn" onclick="adjustVal('cols',-1)">−</button>
      <input class="num-input" id="in-cols" type="number" min="3" max="40" value="10"
             onchange="setVal('cols',this.value,3,40)">
      <span class="setting-unit">列 / ページ</span>
      <button class="num-btn" onclick="adjustVal('cols',1)">＋</button>
    </div>
  </div>
  <div class="setting-row">
    <div class="setting-label">1頁の文字数</div>
    <div class="setting-controls">
      <span class="chars-per-page" id="chars-per-page" style="color:#c9a84c99;font-size:13px;margin-left:0;">200字</span>
    </div>
  </div>
  <hr class="setting-sep">
  <div class="setting-row">
    <div class="setting-label">// コメント</div>
    <div class="setting-controls">
      <div class="toggle" id="tog-comment" onclick="toggleOpt('commentHL')"></div>
      <span class="toggle-text">緑ハイライト</span>
    </div>
  </div>
  <div class="setting-row">
    <div class="setting-label">改行記号</div>
    <div class="setting-controls">
      <div class="toggle" id="tog-newline" onclick="toggleOpt('showNewline')"></div>
      <span class="toggle-text">↵ 表示</span>
    </div>
  </div>
  <div style="text-align:right;margin-top:8px;">
    <span id="version-label" style="color:#c9a84c;font-size:10px;font-family:'Noto Sans JP',sans-serif;letter-spacing:0.05em;">v.1.1.1</span>
  </div>
</div>

<div id="statusbar">
  <div class="status-item">文字数 <span id="char-count">0</span></div>
  <div class="status-sep">｜</div>
  <div class="status-item">行×列 <span id="grid-info">20×10</span></div>
  <div class="status-sep">｜</div>
  <div class="status-item" id="save-status">未保存</div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">ファイル名</h2>
    <input type="text" class="modal-input" id="modal-input" placeholder="タイトルを入力">
    <div class="modal-btns">
      <button class="modal-btn secondary" onclick="closeModal()">キャンセル</button>
      <button class="modal-btn primary" onclick="confirmModal()">決定</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

const editor   = document.getElementById('editor');
const paper    = document.getElementById('paper');
const canvas   = document.getElementById('grid-canvas');
const ctx      = canvas.getContext('2d');
const overlay  = document.getElementById('overlay-canvas');
const octx     = overlay.getContext('2d');
const scroller = document.getElementById('scroll-container');

const hasFS = !!window.showSaveFilePicker;

// ===== STATE =====
const S = {
  fontSize: 18,
  rows: 20,
  cols: 10,
  currentFile: '無題',
  dirty: false,
  saveOk: null,
  // オプション
  commentHL: false,   // //コメントハイライト
  showNewline: false,  // 改行記号表示
};

let fileHandle = null;
let modalCb = null, autoSaveT = null;

// ===== UNDO / REDO (ブラウザ標準) =====
function doUndo() { document.execCommand('undo'); }
function doRedo() { document.execCommand('redo'); }

// テキスト全体を置換
// DOM構築方式で改行を正しく<div>構造にする
function replaceAllText(text) {
  editor.innerHTML = '';
  if (!text) return;
  const lines = text.split('\n');
  lines.forEach((line, i) => {
    if (i === 0) {
      editor.appendChild(document.createTextNode(line));
    } else {
      const div = document.createElement('div');
      if (line === '') {
        div.appendChild(document.createElement('br'));
      } else {
        div.appendChild(document.createTextNode(line));
      }
      editor.appendChild(div);
    }
  });
}

// ===== KEYBOARD SHORTCUTS =====
window.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  // undo/redo はブラウザ標準に任せる（interceptしない）
  if (e.key === 's') { e.preventDefault(); if (e.shiftKey) saveAs(); else saveOverwrite(); }
});

window.addEventListener('beforeunload', e => {
  if (S.dirty) { e.preventDefault(); e.returnValue = ''; }
});

// ===== GRID & LAYOUT =====
const PAD_TOP  = 16;
const PAD_SIDE = 16;

function computeGrid() {
  const fs   = S.fontSize;
  const colW = Math.round(fs * 1.6);
  const cellH = fs;
  const paperH = PAD_TOP * 2 + S.rows * cellH;
  const paperW = PAD_SIDE * 2 + S.cols * colW;
  return { fs, colW, cellH, paperH, paperW };
}

function applyAll() {
  const { fs, colW, cellH, paperH, paperW } = computeGrid();

  editor.style.fontSize   = fs + 'px';
  editor.style.lineHeight = colW + 'px';
  editor.style.padding    = `${PAD_TOP}px ${PAD_SIDE}px`;
  editor.style.height     = paperH + 'px';
  editor.style.wordBreak  = 'break-all';
  editor.style.overflowWrap = 'break-word';
  editor.style.lineBreak  = 'auto';
  paper.style.overflow    = 'hidden';
  paper.style.height      = paperH + 'px';
  paper.style.minWidth    = paperW + 'px';

  requestAnimationFrame(() => {
    syncPaperWidth();
    scheduleCanvasRedraw();
    scheduleOverlayRedraw();
  });
  updateStats();
}

function syncPaperWidth() {
  const { paperW, colW } = computeGrid();
  const computedLH = parseFloat(getComputedStyle(editor).lineHeight) || colW;
  const pageTextW = S.cols * computedLH;

  // editorのmin-widthを一旦外して、テキスト内容だけの実幅を測る
  editor.style.minWidth = '0';
  const contentW = editor.scrollWidth;
  editor.style.minWidth = '100%';

  // テキストが使っているページ数を算出し、+1ページ
  const textAreaW = Math.max(contentW - PAD_SIDE * 2, 0);
  const usedPages = Math.max(1, Math.ceil(textAreaW / pageTextW));
  const totalPages = usedPages + 1;
  const w = PAD_SIDE * 2 + totalPages * pageTextW;

  paper.style.width = Math.max(w, paperW) + 'px';
}

// ===== CANVAS: ページ区切り =====
let canvasRedrawT = null;
function scheduleCanvasRedraw() {
  clearTimeout(canvasRedrawT);
  canvasRedrawT = setTimeout(redrawCanvas, 60);
}

function redrawCanvas() {
  syncPaperWidth();
  const { paperH } = computeGrid();
  const actualW = paper.offsetWidth;
  const actualH = paper.offsetHeight || paperH;

  canvas.width  = actualW;
  canvas.height = actualH;
  canvas.style.width  = actualW + 'px';
  canvas.style.height = actualH + 'px';

  const computedLH = parseFloat(getComputedStyle(editor).lineHeight) || computeGrid().colW;
  renderPageLines({ colW: computedLH, paperH: actualH, paperW: actualW });
}

function renderPageLines({ colW, paperH, paperW }) {
  ctx.clearRect(0, 0, paperW, paperH);

  const textRight = paperW - PAD_SIDE;
  const pageTextW = S.cols * colW;
  const textAreaW = textRight - PAD_SIDE;
  const numPages  = Math.ceil(textAreaW / pageTextW);

  for (let p = 1; p < numPages; p++) {
    const x = textRight - p * pageTextW;
    if (x <= PAD_SIDE) break;

    // 破線のページ区切り
    ctx.save();
    ctx.strokeStyle = 'rgba(160,120,60,0.5)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(x, PAD_TOP * 0.5);
    ctx.lineTo(x, paperH - PAD_TOP * 0.5);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // ページ番号: 右下（区切り線の少し左）
    ctx.save();
    ctx.fillStyle = 'rgba(120,80,30,0.75)';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(String(p + 1), x - 6, paperH - 5);
    ctx.restore();
  }

  // 1ページ目のページ番号: 右下（右端PAD_SIDEの少し左）
  ctx.save();
  ctx.fillStyle = 'rgba(120,80,30,0.75)';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('1', textRight + PAD_SIDE - 6, paperH - 5);
  ctx.restore();
}

// ===== OVERLAY CANVAS: コメントHL, 改行記号 =====
let overlayRedrawT = null;
function scheduleOverlayRedraw() {
  clearTimeout(overlayRedrawT);
  overlayRedrawT = setTimeout(redrawOverlay, 30);
}

function redrawOverlay() {
  const { paperH, colW: gridColW } = computeGrid();
  const actualW = paper.offsetWidth;
  const actualH = paper.offsetHeight || paperH;

  overlay.width  = actualW;
  overlay.height = actualH;
  overlay.style.width  = actualW + 'px';
  overlay.style.height = actualH + 'px';

  octx.clearRect(0, 0, actualW, actualH);

  const text = getCleanText();
  if (!text) return;

  const fs = S.fontSize;
  const computedLH = parseFloat(getComputedStyle(editor).lineHeight) || gridColW;
  const paperRect = paper.getBoundingClientRect();

  // charMapを一度だけ構築して両関数で共有
  const mapped = (S.showNewline || S.commentHL) ? buildCharMap() : null;

  if (S.showNewline && mapped) {
    drawNewlineMarks(paperRect, fs, computedLH, mapped);
  }
  if (S.commentHL && mapped) {
    drawCommentHighlights(paperRect, fs, computedLH, mapped);
  }
}

/*
 * 改行記号表示:
 * charMapベースではなく、DOM上の改行要素（<br>, <div>境界）を
 * 直接走査して座標を取得する方式。空行にも対応。
 *
 * contenteditable の改行構造:
 *   Enter → <div>text<br></div> or テキスト<br>テキスト
 *   空行 → <div><br></div>
 *
 * 方針: 各 <br> と各 <div>（editor直下、最初以外）の位置を取得し、
 *       その位置に改行記号を描画する。
 *       最後の暗黙の<br>（divの末尾br）は改行マーク不要な場合もあるので、
 *       「次に兄弟ノードがない末尾br」かつ「親divが最後の子」なら除外する。
 */
function drawNewlineMarks(paperRect, fs, computedLH, mapped) {
  const markSize = Math.round(fs * 0.55);
  const range = document.createRange();

  // editor直下の子を順に見て、改行位置を収集
  const positions = [];

  function getLastCharRect(node) {
    // ノード内の最後のテキスト文字の座標を返す
    const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
    let lastTextNode = null;
    let tn;
    while ((tn = walker.nextNode())) {
      if (tn.textContent.length > 0) lastTextNode = tn;
    }
    if (lastTextNode) {
      // 最後の非改行文字を探す
      const txt = lastTextNode.textContent;
      for (let i = txt.length - 1; i >= 0; i--) {
        if (txt[i] !== '\n') {
          try {
            range.setStart(lastTextNode, i);
            range.setEnd(lastTextNode, i + 1);
            const r = range.getBoundingClientRect();
            if (r.width || r.height) return r;
          } catch(e) {}
        }
      }
    }
    return null;
  }

  function getBrRect(br) {
    // br要素自体の座標を取得（空行用）
    // rangeでbrを囲む
    try {
      range.selectNode(br);
      const r = range.getBoundingClientRect();
      if (r.x || r.y) return r;
    } catch(e) {}
    return null;
  }

  const children = Array.from(editor.childNodes);

  for (let i = 0; i < children.length; i++) {
    const child = children[i];

    if (child.nodeType === Node.ELEMENT_NODE && child.tagName === 'BR') {
      // editor直下の<br>: 改行位置
      // ただし最後の子のbrは末尾なので除外
      if (i === children.length - 1) continue;

      // brの前にテキストがあればその文字の下に描画
      const prev = child.previousSibling;
      if (prev && prev.nodeType === Node.TEXT_NODE && prev.textContent.replace(/\n/g, '').length > 0) {
        const r = getLastCharRect(prev);
        if (r) {
          positions.push({ x: r.left + r.width / 2, y: r.bottom });
          continue;
        }
      }
      // テキストがない場合（空行）: br自体の位置
      const brR = getBrRect(child);
      if (brR) {
        positions.push({ x: brR.left + brR.width / 2, y: brR.top });
      }

    } else if (child.nodeType === Node.ELEMENT_NODE && (child.tagName === 'DIV' || child.tagName === 'P')) {
      // <div> の末尾 = 改行位置（最後のdivは除外）
      if (i === children.length - 1) continue;

      // div内にテキストがあるか？
      const innerText = child.textContent.replace(/\n/g, '');
      if (innerText.length > 0) {
        // 最後の文字の下に描画
        const r = getLastCharRect(child);
        if (r) {
          positions.push({ x: r.left + r.width / 2, y: r.bottom });
          continue;
        }
      }
      // 空div（空行）: 中の<br>の位置を使う
      const innerBr = child.querySelector('br');
      if (innerBr) {
        const brR = getBrRect(innerBr);
        if (brR) {
          positions.push({ x: brR.left + brR.width / 2, y: brR.top });
          continue;
        }
      }
      // それでもダメならdiv自体の位置
      const divR = child.getBoundingClientRect();
      if (divR.width || divR.height) {
        positions.push({ x: divR.left + divR.width / 2, y: divR.top });
      }

    } else if (child.nodeType === Node.TEXT_NODE) {
      // テキストノード内の \n
      const txt = child.textContent;
      for (let ci = 0; ci < txt.length; ci++) {
        if (txt[ci] === '\n') {
          if (ci > 0) {
            // 直前の文字の下に描画
            try {
              range.setStart(child, ci - 1);
              range.setEnd(child, ci);
              const r = range.getBoundingClientRect();
              if (r.width || r.height) {
                positions.push({ x: r.left + r.width / 2, y: r.bottom });
              }
            } catch(e) {}
          }
        }
      }
    }
  }

  // 描画
  for (const pos of positions) {
    octx.save();
    octx.fillStyle = 'rgba(160,120,60,0.35)';
    octx.font = `${markSize}px "Noto Sans JP", sans-serif`;
    octx.textAlign = 'center';
    octx.textBaseline = 'top';
    octx.fillText('↵',
      pos.x - paperRect.left,
      pos.y - paperRect.top + 1);
    octx.restore();
  }
}

/*
 * コメントハイライト（軽量版）:
 * 行頭が // の行について、先頭文字と末尾文字の座標だけ取得し、
 * 列単位の矩形で塗る。Range API呼び出しは行あたり2回のみ。
 */
function drawCommentHighlights(paperRect, fs, computedLH, mapped) {
  const { charMap, lineStarts } = mapped;
  if (charMap.length === 0) return;

  const range = document.createRange();

  for (let li = 0; li < lineStarts.length; li++) {
    const start = lineStarts[li];
    const end = (li + 1 < lineStarts.length) ? lineStarts[li + 1] : charMap.length;
    const lineLen = end - start;
    if (lineLen < 2) continue;

    const ch0 = charMap[start].node.textContent[charMap[start].localIdx];
    const ch1 = charMap[start + 1].node.textContent[charMap[start + 1].localIdx];
    if (ch0 !== '/' || ch1 !== '/') continue;

    // 先頭文字の座標
    let firstRect = null;
    try {
      range.setStart(charMap[start].node, charMap[start].localIdx);
      range.setEnd(charMap[start].node, charMap[start].localIdx + 1);
      firstRect = range.getBoundingClientRect();
    } catch(e) {}

    // 末尾文字の座標
    const lastIdx = end - 1;
    let lastRect = null;
    try {
      range.setStart(charMap[lastIdx].node, charMap[lastIdx].localIdx);
      range.setEnd(charMap[lastIdx].node, charMap[lastIdx].localIdx + 1);
      lastRect = range.getBoundingClientRect();
    } catch(e) {}

    if (!firstRect || !lastRect) continue;
    if (!(firstRect.width || firstRect.height) || !(lastRect.width || lastRect.height)) continue;

    // 縦書き: 列は右から左へ。firstRectが右側、lastRectが左側（または同じ列）
    const right = Math.max(firstRect.right, lastRect.right) - paperRect.left;
    const left = Math.min(firstRect.left, lastRect.left) - paperRect.left;
    const colTop = PAD_TOP - 2;
    const colH = S.rows * fs + 4;

    octx.save();
    octx.fillStyle = 'rgba(80,200,80,0.13)';
    octx.fillRect(left - 1, colTop, right - left + 2, colH);
    octx.restore();
  }
}

/*
 * editor内のDOMを走査して、文字単位のマップと論理行の開始位置を返す。
 * contenteditable の構造:
 *   初回入力: 直下にTextNode（+ 末尾<br>）
 *   Enter後:  <div>TextNode<br></div> が並ぶ
 * <div>の開始 = 新しい論理行の開始
 * <br> = 改行（次が新しい論理行）
 * テキストノード内の \n も改行扱い
 */
function buildCharMap() {
  const charMap = [];   // [{node: TextNode, localIdx: number}, ...]
  const lineStarts = [0]; // charMapインデックスで論理行の先頭
  let needNewLine = false;

  function walk(el) {
    for (const child of el.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) {
        const txt = child.textContent;
        for (let i = 0; i < txt.length; i++) {
          if (txt[i] === '\n') {
            // テキストノード内の改行 → 新しい論理行
            needNewLine = true;
            continue;
          }
          if (needNewLine) {
            lineStarts.push(charMap.length);
            needNewLine = false;
          }
          charMap.push({ node: child, localIdx: i });
        }
      } else if (child.nodeType === Node.ELEMENT_NODE) {
        if (child.tagName === 'BR') {
          needNewLine = true;
        } else if (child.tagName === 'DIV' || child.tagName === 'P') {
          // ブロック要素 = 新しい論理行
          needNewLine = true;
          walk(child);
          continue;
        } else {
          walk(child);
          continue;
        }
      }
    }
  }

  walk(editor);
  return { charMap, lineStarts };
}

const LIMITS = { fontSize:[10,36], rows:[5,60], cols:[3,40] };
function adjustVal(key, d) { setVal(key, S[key] + d, ...LIMITS[key]); }
function setVal(key, raw, min, max) {
  S[key] = Math.min(max, Math.max(min, parseInt(raw) || S[key]));
  syncUI(); applyAll(); saveCfg();
  if (key === 'rows') showToast(`縦 ${S.rows} 行 / ページ`);

}

}

// ===== INPUT =====
function onInput() {
  S.dirty = true;
  updateSaveStatus();
  updateStats();
  requestAnimationFrame(() => {
    syncPaperWidth();
    scheduleCanvasRedraw();
    scheduleOverlayRedraw();
  });
  clearTimeout(autoSaveT);
  autoSaveT = setTimeout(autosave, 1800);
}

function onKeyDown(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    document.execCommand('insertText', false, '　');
  }
}

function updateStats() {
  const text  = getCleanText();
  const chars = text.replace(/\n/g, '').length;
  const cpp   = S.rows * S.cols;
  document.getElementById('char-count').textContent = chars;
  document.getElementById('chars-per-page').textContent = `1頁 ${cpp}字`;
}

function updateSaveStatus() {
  const ss = document.getElementById('save-status');
  if (S.saveOk === 'ok') {
    ss.textContent = '保存済'; ss.style.color = '#c9a84ccc';
  } else if (S.dirty) {
    ss.textContent = '未保存'; ss.style.color = '#c0392b99';
  } else {
    ss.textContent = '保存済'; ss.style.color = '#c9a84ccc';
  }
  const saveBtn = document.getElementById('btn-save');
  saveBtn.style.color = fileHandle ? '#c9a84ccc' : '#c9a84c55';
  saveBtn.title = fileHandle ? `上書き保存: ${S.currentFile} (Ctrl+S)` : '上書き保存（まず別名保存してください）';
}

function autosave() {
  localStorage.setItem('tg_last', JSON.stringify({ title: S.currentFile, content: getCleanText() }));
}

// DOMを走査してテキストを取得（innerTextの改行重複問題を回避）
function getCleanText() {
  const lines = [];
  const children = editor.childNodes;

  if (children.length === 0) return '';

  for (let i = 0; i < children.length; i++) {
    const child = children[i];
    if (child.nodeType === Node.TEXT_NODE) {
      // 直下のテキストノード（通常は最初の行）
      lines.push(child.textContent);
    } else if (child.nodeType === Node.ELEMENT_NODE) {
      if (child.tagName === 'DIV' || child.tagName === 'P') {
        // <div>内がbrのみ → 空行
        // <div>内にテキストあり → その行
        const txt = child.textContent;
        if (txt === '' || (child.childNodes.length === 1 && child.firstChild.nodeName === 'BR')) {
          lines.push('');
        } else {
          lines.push(txt);
        }
      } else if (child.tagName === 'BR') {
        lines.push('');
      }
    }
  }

  return lines.join('\n');
}

// ===== SAVE =====
async function saveOverwrite() {
  const text = getCleanText();
  if (hasFS && fileHandle) {
    try {
      const writable = await fileHandle.createWritable();
      await writable.write(text);
      await writable.close();
      S.dirty = false; S.saveOk = 'ok';
      autosave(); updateSaveStatus();
      showToast('上書き保存しました');
      setTimeout(() => { S.saveOk = null; updateSaveStatus(); }, 2000);
      return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  await saveAs();
}

async function saveAs() {
  const text = getCleanText();
  const safeName = (S.currentFile || '無題').replace(/[\\/:*?"<>|]/g, '_');
  if (hasFS) {
    try {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: safeName + '.txt',
        types: [{ description: 'テキストファイル', accept: { 'text/plain': ['.txt'] } }],
      });
      const fileName = fileHandle.name || safeName + '.txt';
      S.currentFile = fileName.replace(/\.txt$/i, '');
      document.getElementById('toolbar-title').textContent = S.currentFile;
      const writable = await fileHandle.createWritable();
      await writable.write(text);
      await writable.close();
      S.dirty = false; S.saveOk = 'ok';
      autosave(); updateSaveStatus();
      showToast('「' + S.currentFile + '」を保存しました');
      setTimeout(() => { S.saveOk = null; updateSaveStatus(); }, 2000);
      return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  showModal('ファイル名を入力', S.currentFile, (title) => {
    if (!title) return;
    S.currentFile = title;
    document.getElementById('toolbar-title').textContent = title;
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = title + '.txt';
    a.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(a);
    setTimeout(() => { a.click(); setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 500); }, 0);
    fileHandle = null; S.dirty = false; S.saveOk = 'ok';
    autosave(); updateSaveStatus();
    showToast('「' + title + '」を保存しました');
    setTimeout(() => { S.saveOk = null; updateSaveStatus(); }, 2000);
  });
}

// ===== OPEN =====
async function openDoc() {
  if (S.dirty && getCleanText().trim()) {
    if (!confirm('未保存の変更があります。破棄して開きますか？')) return;
  }
  if (hasFS) {
    try {
      const [fh] = await window.showOpenFilePicker({
        types: [{ description: 'テキストファイル', accept: { 'text/plain': ['.txt', '.md'] } }],
        multiple: false,
      });
      const file = await fh.getFile();
      const text = await file.text();
      replaceAllText(text);
      S.currentFile = file.name.replace(/\.[^.]+$/, '');
      document.getElementById('toolbar-title').textContent = S.currentFile;
      fileHandle = fh; S.dirty = false;
      applyAll(); updateStats(); updateSaveStatus();
      showToast('「' + S.currentFile + '」を開きました');
      return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.txt,.md';
  inp.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(inp);
  inp.onchange = (e) => {
    const f = e.target.files[0];
    if (!f) { cleanup(); return; }
    const r = new FileReader();
    r.onload = (ev) => {
      replaceAllText(ev.target.result);
      S.currentFile = f.name.replace(/\.[^.]+$/, '');
      document.getElementById('toolbar-title').textContent = S.currentFile;
      fileHandle = null; S.dirty = false;
      applyAll(); updateStats(); updateSaveStatus();
      showToast('「' + S.currentFile + '」を開きました');
      cleanup();
    };
    r.onerror = () => { alert('読み込みに失敗しました'); cleanup(); };
    r.readAsText(f, 'UTF-8');
  };
  function cleanup() { try { document.body.removeChild(inp); } catch {} }
  setTimeout(() => inp.click(), 0);
}

// ===== NEW =====
function newDoc() {
  if (S.dirty && getCleanText().trim()) {
    if (!confirm('未保存の変更があります。新規作成しますか？')) return;
  }
  replaceAllText('');
  S.currentFile = '無題'; fileHandle = null;
  document.getElementById('toolbar-title').textContent = '無題';
  S.dirty = false;
  applyAll(); updateStats(); updateSaveStatus();
  showToast('新規文書を作成しました');
}

// ===== MODAL =====
function showModal(title, def, cb) {

  document.getElementById('modal-input').value = def || '';
  modalCb = cb;

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); modalCb = null; }
function confirmModal() { const v = document.getElementById('modal-input').value.trim(); closeModal(); if (modalCb) modalCb(v); }

// ===== WHEEL =====
scroller.addEventListener('wheel', e => {
  if (e.shiftKey) return;
  e.preventDefault();
  scroller.scrollLeft -= e.deltaY;
}, { passive: false });

// ===== CUSTOM SCROLLBAR =====
const scrollbar = document.getElementById('custom-scrollbar');
const thumb = document.getElementById('scrollbar-thumb');
let sbDragging = false;
let sbDragStartX = 0;
let sbDragStartScroll = 0;

function updateScrollbar() {
  const containerW = scroller.clientWidth;
  const scrollW = scroller.scrollWidth;

  if (scrollW <= containerW) {
    scrollbar.style.display = 'none';
    return;
  }
  scrollbar.style.display = 'block';

  const trackW = scrollbar.clientWidth;
  const ratio = containerW / scrollW;
  const thumbW = Math.max(30, Math.round(trackW * ratio));
  thumb.style.width = thumbW + 'px';

  // direction:rtl では scrollLeft が 0（右端）〜負値（左へスクロール）
  const maxScroll = scrollW - containerW;
  const currentScroll = Math.abs(scroller.scrollLeft);
  const scrollRatio = maxScroll > 0 ? currentScroll / maxScroll : 0;

  // スクロールバーは左が先頭（右端=1ページ目）、右がスクロール先（左方向）
  // direction:rtl なので右端が原点 → thumbは右寄りから左へ動く
  const thumbX = (trackW - thumbW) * (1 - scrollRatio);
  thumb.style.left = thumbX + 'px';
}

// スクロール時にthumb位置を更新
scroller.addEventListener('scroll', updateScrollbar);

// thumb ドラッグ
thumb.addEventListener('mousedown', e => {
  e.preventDefault();
  sbDragging = true;
  sbDragStartX = e.clientX;
  sbDragStartScroll = scroller.scrollLeft;
  thumb.classList.add('dragging');
});

window.addEventListener('mousemove', e => {
  if (!sbDragging) return;
  e.preventDefault();
  const dx = e.clientX - sbDragStartX;
  const trackW = scrollbar.clientWidth;
  const thumbW = thumb.clientWidth;
  const scrollW = scroller.scrollWidth;
  const containerW = scroller.clientWidth;
  const maxScroll = scrollW - containerW;
  const scrollPerPx = maxScroll / (trackW - thumbW);
  // ドラッグ方向: 右にドラッグ → scrollLeftを正方向（RTLでは負を増やす）
  scroller.scrollLeft = sbDragStartScroll + dx * scrollPerPx;
});

window.addEventListener('mouseup', () => {
  if (sbDragging) {
    sbDragging = false;
    thumb.classList.remove('dragging');
  }
});

// タッチ対応
thumb.addEventListener('touchstart', e => {
  e.preventDefault();
  sbDragging = true;
  sbDragStartX = e.touches[0].clientX;
  sbDragStartScroll = scroller.scrollLeft;
  thumb.classList.add('dragging');
}, { passive: false });

window.addEventListener('touchmove', e => {
  if (!sbDragging) return;
  const dx = e.touches[0].clientX - sbDragStartX;
  const trackW = scrollbar.clientWidth;
  const thumbW = thumb.clientWidth;
  const scrollW = scroller.scrollWidth;
  const containerW = scroller.clientWidth;
  const maxScroll = scrollW - containerW;
  const scrollPerPx = maxScroll / (trackW - thumbW);
  scroller.scrollLeft = sbDragStartScroll + dx * scrollPerPx;
}, { passive: true });

window.addEventListener('touchend', () => {
  if (sbDragging) {
    sbDragging = false;
    thumb.classList.remove('dragging');
  }
});

// トラッククリックでジャンプ
scrollbar.addEventListener('click', e => {
  if (e.target === thumb) return;
  const trackW = scrollbar.clientWidth;
  const thumbW = thumb.clientWidth;
  const clickX = e.clientX - scrollbar.getBoundingClientRect().left;
  const scrollW = scroller.scrollWidth;
  const containerW = scroller.clientWidth;
  const maxScroll = scrollW - containerW;
  // クリック位置からスクロール位置を計算
  const targetRatio = 1 - (clickX - thumbW / 2) / (trackW - thumbW);
  const clampedRatio = Math.max(0, Math.min(1, targetRatio));
  scroller.scrollLeft = -(clampedRatio * maxScroll);
});

// 初回 & リサイズ時に更新
new ResizeObserver(updateScrollbar).observe(scroller);
setTimeout(updateScrollbar, 100);

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1900);
}

// ===== INIT =====
function init() {
  try {
    const cfg = localStorage.getItem('tg_cfg');
    if (cfg) {
      const c = JSON.parse(cfg);
      ['fontSize','rows','cols','commentHL','showNewline'].forEach(k => {
        if (c[k] !== undefined) S[k] = c[k];
      });
    }
    const last = localStorage.getItem('tg_last');
    if (last) {
      const d = JSON.parse(last);
      const content = d.content || '';
      S.currentFile = d.title || '無題';
      // innerTextではなくDOM構築で復元（改行重複を防ぐ）
      editor.innerHTML = '';
      if (content) {
        const lines = content.split('\n');
        lines.forEach((line, i) => {
          if (i === 0 && lines.length === 1) {
            // 1行だけの場合はテキストノードのみ
            editor.appendChild(document.createTextNode(line));
          } else if (i === 0) {
            editor.appendChild(document.createTextNode(line));
          } else {
            const div = document.createElement('div');
            if (line === '') {
              div.appendChild(document.createElement('br'));
            } else {
              div.appendChild(document.createTextNode(line));
            }
            editor.appendChild(div);
          }
        });
      }
    }
  } catch(e) {}

  applyAll();
  syncUI();
  updateSaveStatus();
  document.getElementById('toolbar-title').textContent = S.currentFile;
  setTimeout(() => { scroller.scrollLeft = 0; }, 60);
}

init();

// ===== FILE HANDLER: 「アプリで開く」対応 =====
if ('launchQueue' in window) {
  window.launchQueue.setConsumer(async (launchParams) => {
    if (!launchParams.files || !launchParams.files.length) return;
    const fh = launchParams.files[0];
    const file = await fh.getFile();
    const text = await file.text();
    replaceAllText(text);
    S.currentFile = file.name.replace(/\.[^.]+$/, '') || '無題';
    document.getElementById('toolbar-title').textContent = S.currentFile;
    fileHandle = fh;
    S.dirty = false;
    applyAll(); updateStats(); updateSaveStatus();
    showToast('「' + S.currentFile + '」を開きました');
  });
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
